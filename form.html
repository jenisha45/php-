<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form validation using php</title>
</head>

<body>
    <form method="post" action="form.php">
        <fieldset>
            <legend>PHP Form Validation Example</legend>
            <label for="name">Full name:</label>
            <input type="text" name="name" placeholder="Enter your name"><br><br>
            <label for="email">Email:</label>
            <input type="email" name="email" placeholder="Enter your mail:abc@gmail.com"><br><br>
            <label for="website">Website:</label>
            <input type="text" name="website" placeholder="https://www.w3schools.com/php/php_form_validation.asp"><br><br>
            <label for="comment">Comment:</label>
            <textarea rows="20" cols="10"></textarea><br><br>
            <label for="gender">Gender:</label>
            <input type="radio" name="gender" value="female">Female<br><br>
            <input type="radio" name="gender" value="male">Male<br><br>
            <input type="radio" name="gender" value="other">Other<br><br>
            <button value="submit">Submit</button>
        </fieldset>
    </form>
</body>

</html>
